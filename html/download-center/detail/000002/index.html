      "use strict";
      var downloadText = document.getElementById("text-downloading");
      var downloadButton = document.getElementById("download-button");
      var dlProgressBar = document.getElementById("dl-progress-bar");
      var downloadCompleteText = document.getElementById("text-dl-complete");
      downloadButton.addEventListener("click", function() {
        var download = createXHR();
        dlProgressBar.setAttribute("aria-valuenow", "0");
        dlProgressBar.setAttribute("class", "dl-progress-bar-show");
        setTimeout(function() {
          download.open("GET", "/download-center/files/miikun-sticker.zip", true);
          download.responseType = "blob";
          download.onloadstart = function() {
            downloadText.removeAttribute("class");
          };

          download.onprogress = function(e) {
            if (e.lengthComputable) { dlProgressBar.setAttribute("aria-valuenow", Math.floor((e.loaded / e.total) * 100)); }
          }

          download.onload = function() {
            var blob = new Blob([download.response], { type: "application/zip" });
            var url = URL.createObjectURL(blob);
            var downloadLink = document.createElement("a");
            dlProgressBar.setAttribute("aria-valuenow", "100");
            downloadText.setAttribute("class", "hidden");
            downloadCompleteText.removeAttribute("class");
            downloadLink.setAttribute("class", "hidden");
            downloadLink.setAttribute("aria-hidden", "true");
            downloadLink.href = url;
            downloadLink.download = "miikun-sticker.zip";
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
            URL.revokeObjectURL(url);
            setTimeout(function() {
              dlProgressBar.setAttribute("aria-valuenow", "0");
              setTimeout(function() {
                dlProgressBar.removeAttribute("class");
                downloadCompleteText.setAttribute("class", "hidden");
                setTimeout(function() {
                  dlProgressBar.setAttribute("class", "invisible");
                }, 400);
              }, 50);
            }, 600);
          };

          download.onerror = function() {
            dlProgressBar.style.setAttribute("class", "error");
            dlProgressBar.setAttribute("aria-valuenow", "100");
          };
          download.send();
        }, 850);
      });
    </script>
