    <script nonce="<?php echo $GLOBALS['csp_nonce']; ?>">
      window.verifyRequestXHR = function(t) {
        if (t) {
          document.getElementById("recaptcha-token").setAttribute("value", t);
          document.getElementById("recaptcha-token").value = t;
        }
        var recaptcha = document.getElementById("g-recaptcha");
        var getEmailBtn = document.getElementById("get-email");
        var statusText = document.getElementById("status-label");
        var loadProgressBar = document.getElementById("load-progress-bar");
        var verify = createXHR();
        recaptcha.setAttribute("class", "hidden");
        getEmailBtn.setAttribute("class", "hidden");
        loadProgressBar.setAttribute("class", "dl-progress-bar-show");
        verify.open("POST", "/get-email.html", true);
        verify.setRequestHeader("X-Requested-With", "XMLHttpRequest");
        verify.setRequestHeader("X-reCAPTCHA-Token", t);
        verify.setRequestHeader("X-reCAPTCHA-Action", "<?php echo $recaptcha_act; ?>");
        verify.onloadstart = function() {
          statusText.textContent = "通信中";
          statusText.removeAttribute("class");
        };
        verify.onprogress = function(e) {
          if (e.lengthComputable) { loadProgressBar.setAttribute("aria-valuenow", Math.floor((e.loaded / e.total) * 100)); }
        }
        verify.onload = function() {
          grecaptcha.enterprise.reset(window.widgetId);
          loadProgressBar.setAttribute("aria-valuenow", "100");
          statusText.textContent = "完了！";
          document.getElementById("result").innerHTML = verify.responseText;
            setTimeout(function() {
              loadProgressBar.setAttribute("aria-valuenow", "0");
              setTimeout(function() {
                loadProgressBar.removeAttribute("class");
                statusText.setAttribute("class", "hidden");
                setTimeout(function() {
                  loadProgressBar.setAttribute("class", "hidden");
                }, 400);
              }, 50);
            }, 600);
        }
        verify.onerror = function() {
          loadProgressBar.setAttribute("class", "error");
          loadProgressBar.setAttribute("aria-valuenow", "100");
          setTimeout(function() {
            statusText.setAttribute("class", "hidden");
          }, 600);
        };
        verify.send();
      }
    </script>
