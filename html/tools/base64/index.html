    <script nonce="<?php echo $GLOBALS['csp_nonce']; ?>">
      "use strict";
      var currentMode = document.getElementById("current-mode");
      var currentRTConvertState = document.getElementById("rt-convert-state");
      if (!window.TextEncoder) { document.getElementById("ie-warn").removeAttribute("class"); }
      document.getElementById("mode-toggle").addEventListener("change", function() {
        if (document.getElementById("mode-toggle").checked === true) {
          currentMode.textContent = "エンコード";
        } else {
          currentMode.textContent = "デコード";
        }
        if (document.getElementById("rt-convert-toggle").checked === true) {
          convert();
        }
      });
      document.getElementById("rt-convert-toggle").addEventListener("change", function() {
        if (document.getElementById("rt-convert-toggle").checked === true) {
          currentRTConvertState.textContent = "有効";
        } else {
          currentRTConvertState.textContent = "無効";
        }
      });
      document.getElementById("input").addEventListener("input", function() {
        if (document.getElementById("rt-convert-toggle").checked === true) {
          convert();
        }
      });
      document.getElementById("execute").addEventListener("click", convert);
      function convert() {
        var r = null;
        var i = document.getElementById("input").value;
        if (!i) {
          document.getElementById("result").value = "";
          return;
        }
        try {
          if (document.getElementById("mode-toggle").checked === true) {
            if (window.TextEncoder) {
              r = btoa(Array.from(new TextEncoder().encode(i), function(b) { return String.fromCodePoint(b); }).join(""));
            } else {
              r = btoa(i);
            }
          } else {
            if (window.TextEncoder) {
              r = new TextDecoder().decode(Uint8Array.from(atob(i), function(m) { return m.codePointAt(0); }));
            } else {
              r = atob(i);
            }
          }
        } catch (e) { r = ":( エラー" }
        var re = document.getElementById("result");
        re.setAttribute("value", r);
        re.value = r;
      }
    </script>
