    <script nonce="<?php echo $GLOBALS['csp_nonce']; ?>">
      "use strict";
      var d = document.getElementById("input");
      var m = document.getElementById("mode");
      m.addEventListener("change", function() {
        if (m.checked === true) {
          d.setAttribute("type", "text"); 
        } else {
          d.setAttribute("type", "datetime-local"); 
        }
      });
      document.getElementById("execute").addEventListener("click", function() {
        var r = null;
        if (m.checked === true) {
          var da = new Date(parseInt(d.value) * 1000);
          r = new Date(da.getTime() - da.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
        } else {
          r = Math.floor(new Date(d.value).getTime() / 1000);
        }
        var re = document.getElementById("result");
        re.setAttribute("value", r);
        re.value = r;
      });
    </script>
