    <script nonce="<?php echo $GLOBALS['csp_nonce']; ?>">
      "use strict";
      document.getElementById("login").addEventListener("click", function() {
        var response = grecaptcha.enterprise.getResponse(window.widgetId);
        if (!response) { return; }
        var login = createXHR();
        var data = {
          name: document.getElementById("loginid").textContent.replace(/&/g, "&amp;").replace(/'/g, "&apos;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;").trim(),
          captcha: response,
          action: "LOGIN"
        };

        login.open("POST", "/login.html", true);
        login.setRequestHeader("Content-Type", "application/json");

        login.onload = function() { grecaptcha.reset(widgetId); };
        login.send(JSON.stringify(data));
      });
    </script>
